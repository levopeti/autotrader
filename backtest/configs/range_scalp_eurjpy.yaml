strategy: range_scalp
data:
  tick_parquet: ./data/tick_data_EURJPY.parquet
  epic: EURJPY
engine:
  candle_tf: 5min
  max_gap_factor: 2.0
  min_segment_duration: 2h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 7200
  slippage: 0.005                  # ~0.5 pip
  commission_per_trade: 0.0
  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0
strategy_params:
  ltf_candle_tf: 5min
  htf_candle_tf: 1h
  adx_period: 14
  adx_threshold: 40.0
  bb_period: 20
  bb_std: 2.0
  bb_squeeze_pct: 0.35
  range_lookback: 50
  entry_buffer: 0.005              # 0.5 pip (GOLD 0.30 → skálázva)
  entry_zone_pct: 0.30
  min_range_atr_mult: 1.5
  max_range_atr_mult: 30.0
  tick_vel_window: 20
  tick_vel_max: 3.0
  spread_z_window: 200
  spread_z_max: 2.5
  tick_imbalance_window: 10
  tick_imbalance_max_opposite: 0.5
  cooldown_minutes: 30
  tp_max_range_pct: 1.0
  sl_mode: range_pct
  tp_mode: range_pct
  sl_range_pct: 0.20
  tp_range_pct: 0.50
  sl_dollars: 0.05                 # backup
  tp_dollars: 0.08
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  atr_period: 14
  min_sl_distance: 0.005           # 0.5 pip
  enable_session_filter: true
  session_start: 7
  session_end: 21
  trend_filter_enabled: true
  trend_filter_tf: 4h
  trend_filter_ema_fast: 9
  trend_filter_ema_slow: 21
  signal_confirmations: 10
