# MicroScalp — hangolható paraméterek

strategy_params:
  # Trend protection
  trend_mode:               {type: categorical, choices: [off, block, trend_only]}
  trend_strong_atr_mult:    {type: float, low: 0.2,  high: 1.5}
  ema_period:               {type: int,   low: 10,   high: 50}
  ema_slope_lookback:       {type: int,   low: 2,    high: 10}
  atr_period:               {type: int,   low: 7,    high: 28}

  # Tick-szintű mikro-range
  micro_window_ticks:       {type: int,   low: 100,  high: 1500}
  max_micro_range:          {type: float, low: 0.3,  high: 5.0}

  # Z-score
  zscore_window_ticks:      {type: int,   low: 50,   high: 600}
  zscore_entry:             {type: float, low: 1.0,  high: 4.0}
  min_std:                  {type: float, low: 0.01, high: 0.2}

  # TP / SL — mód + paraméterek
  sl_mode:                  {type: categorical, choices: [fixed_dollars, atr_mult]}
  tp_mode:                  {type: categorical, choices: [fixed_dollars, atr_mult]}
  tp_dollars:               {type: float, low: 0.2,  high: 3.0}
  sl_dollars:               {type: float, low: 0.3,  high: 5.0}
  tp_atr_mult:              {type: float, low: 0.1,  high: 2.0}
  sl_atr_mult:              {type: float, low: 0.2,  high: 3.0}

  # Cooldown
  cooldown_seconds:         {type: float, low: 0.0,  high: 300.0}

engine:
  max_hold_seconds:         {type: int, low: 60,  high: 1800}
  sizing_mode:              {type: categorical, choices: [fixed_lot, fixed_risk]}
  risk_pct:                 {type: float, low: 0.002, high: 0.02}
