strategy: signal_replay

data:
  tick_parquet: ./data/tick_data_GOLD.parquet
  epic: GOLD

engine:
  candle_tf: 5min
  max_gap_factor: 2.0
  min_segment_duration: 1h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 7200
  slippage: 0.05
  commission_per_trade: 0.0

  # ── Új trailing mód: a tp_ladder a strategiától jövő ladder_trigger/dest
  # ár-szinteket használja (NEM ATR-alapú)
  trailing_mode: tp_ladder

  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0

strategy_params:
  signals_dir: ./data/signals
  candle_tf: 1min
  channels: [3496306840]            # Traderz Gold VIP

  signal_timeout_minutes: 15.0
  entry_zone_expand: 1.0
  tp_strategy: first
  tp_idx: 4                         # 0-based 4 = TP5 (legtávolabbi)

  # TP-ladder: amint az ár eléri TP3-at (tp_idx=2), SL → TP1 (tp_idx=0)
  ladder_trigger_idx: 2
  ladder_dest_idx: 0
