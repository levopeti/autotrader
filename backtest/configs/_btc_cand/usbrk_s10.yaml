data:
  epic: BTCUSD
  tick_parquet: ./data/tick_pseudo_BTC_3y.parquet
engine:
  allow_multiple_directions: false
  candle_tf: 1h
  commission_per_trade: 0.0
  equity: 10000.0
  fixed_lot_size: 0.01
  max_gap_factor: 3.0
  max_hold_seconds: 57600
  max_open_positions: 1
  max_order_size: 0.1
  min_order_size: 0.001
  min_segment_duration: 1h
  sizing_mode: fixed_lot
  slippage: 10.0
  trailing_mode: none
strategy: london_breakout
strategy_params:
  asia_end_hour: 13
  buffer_datr_frac: 0.03
  datr_period: 14
  entry_end_hour: 18
  max_range_datr_mult: 1.2
  min_asia_bars: 11
  session_close_hour: 22
  trend_ema: 20
  trend_filter_enabled: true
