strategy: signal_replay

data:
  tick_parquet: ./data/tick_data_GOLD.parquet
  epic: GOLD

engine:
  candle_tf: 5min
  max_gap_factor: 2.0
  min_segment_duration: 1h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 7200
  slippage: 0.05
  commission_per_trade: 0.0
  trailing_mode: none
  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0

strategy_params:
  signals_dir: ./data/signals
  candle_tf: 5min
  channels: null
  signal_timeout_minutes: 15.0
  entry_zone_expand: 1.0
  tp_strategy: first
  tp_idx: 0

  consensus_required: true
  consensus_window_min: 60.0
  consensus_price_tol: 5.0
  consensus_min_channels: 2
