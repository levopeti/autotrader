strategy: donchian_breakout

# ============================================================================
# DONCHIAN LIVE RECEPT (2026-09-09, robusztussági battérián validált)
# ============================================================================
# 2y Dukascopy, 0.30 slippage-stressz: +$2,090 (+$87/hó), PF 1.56, Sharpe 2.27
#   - minden teljes félév pozitív (24H2..26H1), 8/9 negyedév pozitív
#   - paraméter-plató: 19/19 variáns pozitív (period 10-40 × trail 1.5-2.5)
#   - walk-forward 6hó IS→2hó OOS: fix config +$1,739 (7/8 ablak+),
#     megegyezik a re-optimalizálttal → strukturális edge
# 120d Capital tick: +$190 (slip .30), PF 1.24
#
# Kulcs-elv: 1h TF + 3-NAPOS max hold + ATR-trail (a 4h-holdos verzió csak
# +$34-et tudott — a trend futni hagyása az edge fő forrása).
# Center-config deploy (p20/tr2.0), NEM a rács-max p15 (anti-overfit döntés).
# ============================================================================

data:
  tick_parquet: ./data/tick_data_GOLD.parquet   # live-ban nem használt
  epic: GOLD

engine:
  candle_tf: 1h
  max_gap_factor: 2.0
  min_segment_duration: 1h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 259200          # 3 nap — a kulcs-paraméter
  slippage: 0.10
  commission_per_trade: 0.0
  trailing_mode: atr_trail
  trail_atr_mult: 2.0
  break_even_trigger_atr_mult: 1.0
  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0

strategy_params:
  candle_tf: 1h
  donchian_period: 20
  atr_period: 14
  sl_atr_mult: 2.0
  tp_atr_mult: 20.0                 # gyakorlatilag off — a trail zár
  breakout_buffer: 0.0
  trend_filter_enabled: true
  trend_filter_tf: 4h
  trend_ema_fast: 9
  trend_ema_slow: 21
  cooldown_bars: 5
