strategy: london_breakout

# ============================================================================
# LONDON BREAKOUT LIVE RECEPT (2026-09-09, engine-validált)
# ============================================================================
# 2y engine backtest (slip .30): +$646 (+$27/hó), PF 1.34, WR 55%, DD -$362
# 120d Capital tick (slip .30):  +$263 (+$66/hó), PF 3.14, WR 65%, DD -$56
# Standalone sim 2y: 4/4 félév pozitív — regime-robusztus
# Profil: napon belüli (TIME_EXIT 20:00 UTC), nincs overnight — jól
# diverzifikálja a 3-napos donchiant.
# ============================================================================

data:
  tick_parquet: ./data/tick_data_GOLD.parquet   # live-ban nem használt
  epic: GOLD

engine:
  candle_tf: 1h
  max_gap_factor: 2.0
  min_segment_duration: 1h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 57600           # 16h backstop (a TIME_EXIT az elsődleges)
  slippage: 0.10
  commission_per_trade: 0.0
  trailing_mode: none
  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0

strategy_params:
  asia_end_hour: 7
  entry_end_hour: 13
  session_close_hour: 20
  buffer_datr_frac: 0.05
  max_range_datr_mult: 1.2
  datr_period: 14
  trend_ema: 20
  trend_filter_enabled: true
