strategy: kalman_mr

# KAMR baseline — 1D Kalman szűrő fair_price becslés, mean-reversion
# spread²-alapú R (adaptív observation noise), warmup 500 tick

data:
  tick_parquet: ./data/tick_data_GOLD.parquet
  epic: GOLD

engine:
  candle_tf: 5min
  max_gap_factor: 2.0
  min_segment_duration: 2h
  max_open_positions: 1
  allow_multiple_directions: false
  max_hold_seconds: 3600
  slippage: 0.10
  commission_per_trade: 0.0

  sizing_mode: fixed_lot
  fixed_lot_size: 1.0
  min_order_size: 0.5
  max_order_size: 3.0
  equity: 10000.0

strategy_params:
  ltf_candle_tf: 5min

  # Kalman
  Q: 0.0001                        # process noise (adaptálás sebessége)
  R_scale: 1.0                     # spread²-hoz szorzó
  R_min: 0.01                      # $² alsó korlát

  # Signal küszöbök (σ egységben)
  K_entry: 2.5
  K_exit: 3.5

  # SL — ATR-alapú
  atr_period: 14
  sl_atr_mult: 1.5
  min_sl_distance: 0.10

  # Warmup + cooldown
  warmup_ticks: 500
  cooldown_min: 15.0

  # Session (UTC)
  enable_session_filter: true
  session_start: 7
  session_end: 21
